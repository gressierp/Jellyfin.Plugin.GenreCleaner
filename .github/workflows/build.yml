name: Build Jellyfin Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x  # <--- PASSAGE EN .NET 9

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: GenreCleaner-Plugin
          path: bin/Release/net10.0/Jellyfin.Plugin.GenreCleaner.dll # <--- MISE À JOUR DU CHEMIN
